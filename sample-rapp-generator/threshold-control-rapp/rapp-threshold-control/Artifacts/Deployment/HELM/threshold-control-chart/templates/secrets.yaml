apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threshold-control-chart.fullname" . }}-secrets
  labels:
    {{- include "threshold-control-chart.labels" . | nindent 4 }}
type: Opaque
data:
  influxdb-token: {{ .Values.influxdb.token | default "" | b64enc | quote }}
  sdnc-password: {{ .Values.sdnc.password | default "admin" | b64enc | quote }}